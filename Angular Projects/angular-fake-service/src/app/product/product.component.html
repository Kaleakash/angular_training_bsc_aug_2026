<div>
    <h2>Product Rest API</h2>
    <input type="button" value="Get All Products" (click)="loadProducts()">
    <hr/>
    <table border="1" width="100%">
        <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Price</th>
            <th>Image</th>
        </tr>
        <tr *ngFor="let product of products">
            <td>{{product.id}}</td>
            <td>{{product.title}}</td>
            <td>{{product.price}}</td>
            <td><img [src]="product.images[0]" [alt]="product.title" width="100" height="100"></td>
        </tr>
        </table>    
</div>
